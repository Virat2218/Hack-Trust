services:
  trustshield-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustshield-ai
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - SAFE_BROWSING_API_KEY=${SAFE_BROWSING_API_KEY:-}
      - FACT_CHECK_API_KEY=${FACT_CHECK_API_KEY:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
